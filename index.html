        const generateContent = (topic, customData, activeColors) => {
          let contentMap = [];
          switch (topic) {
            case 'addition10':
              const sums = [3, 4, 5, 6, 7, 8, 9, 10];
              contentMap = sums.map(sum => {
                let qs = [];
                for (let i = 1; i < sum; i++) qs.push(`${i}+${sum - i}`);
                if(qs.length === 0) qs.push(`${sum}+0`);
                return { answer: sum.toString(), questions: qs };
              });
              break;
            case 'multiplication':
              const prods = [12, 16, 20, 24, 30, 36, 40, 48];
              contentMap = prods.map(prod => {
                let qs = [];
                for (let i = 2; i <= 10; i++) {
                  if (prod % i === 0 && prod / i <= 10) qs.push(`${i}×${prod / i}`);
                }
                if(qs.length === 0) qs.push(`1×${prod}`);
                return { answer: prod.toString(), questions: qs };
              });
              break;
            case 'roots':
              contentMap = [
                { answer: 'כ.ת.ב', questions: ['מכתב', 'כותב', 'כתיבה'] },
                { answer: 'ש.מ.ר', questions: ['שומר', 'שמירה', 'נשמור'] },
                { answer: 'י.ש.ב', questions: ['יושב', 'ישיבה', 'מושב'] },
                { answer: 'ל.מ.ד', questions: ['תלמיד', 'לומדת', 'לומדים'] },
                { answer: 'ה.ל.כ', questions: ['הולך', 'הליכה', 'נלך'] },
                { answer: 'א.כ.ל', questions: ['אוכל', 'מאכל', 'אכלנו'] },
                { answer: 'ש.י.ר', questions: ['שיר', 'משורר', 'שירה'] },
                { answer: 'ר.ק.ד', questions: ['רוקד', 'ריקוד', 'רקדן'] }
              ];
              break;
            case 'wordFamilies':
              contentMap = [
                { answer: 'ילד', questions: ['ילדים', 'ילדה', 'ילדות'] },
                { answer: 'ספר', questions: ['סיפור', 'סופר', 'ספרים'] },
                { answer: 'גן', questions: ['גנן', 'גננת', 'גינה'] },
                { answer: 'חבר', questions: ['חברה', 'חברים', 'חברות'] },
                { answer: 'שחק', questions: ['משחק', 'שחקן', 'משחקים'] },
                { answer: 'למד', questions: ['תלמיד', 'לומדת', 'לומדים'] },
                { answer: 'כתב', questions: ['מכתב', 'כותב', 'כתיבה'] },
                { answer: 'אכל', questions: ['מאכל', 'אוכלת', 'אכלנו'] }
              ];
              break;
            case 'custom':
              contentMap = activeColors.map((color, i) => {
                const customEntry = customData[i];
                return {
                  answer: customEntry?.answer || `תשובה ${i+1}`,
                  questions: customEntry?.questions.filter(q => q.trim() !== '') || [`שאלה ${i+1}`]
                };
              });
              contentMap = contentMap.map(c => c.questions.length === 0 ? { ...c, questions: ['?'] } : c);
              break;
            default:
              contentMap = [];
          }
          return contentMap;
        };

        // --- ניהול המצב (State) ---
        let mode = 'student'; 
        let currentTopic = 'addition10';
        let currentImageId = 'lion'; 
        let currentPaletteId = 'pastel';

        let pathData = {};

        const getActiveColors = () => PALETTES.find(p => p.id === currentPaletteId).colors;

            const activeColors = getActiveColors();
            const content = generateContent(currentTopic, customData, activeColors);
            const imageDef = IMAGES[currentImageId];
            
            gameLegend = activeColors.map((color, index) => ({
                colorIndex: index,
                hex: color.hex,
                answer: content[index]?.answer || '?'
            }));

            pathData = {};
            let pathIndex = 0;
            
            imageDef.paths.forEach(path => {
                const safeGroup = pathIndex % activeColors.length; 
                const groupContent = content[safeGroup];
                const randomQuestion = groupContent.questions[Math.floor(Math.random() * groupContent.questions.length)];
                
                pathData[path.id] = {
                    question: randomQuestion,
                    answer: groupContent.answer,
                    colorIndex: safeGroup,
                    isFilled: false
                };
                pathIndex++;
            });

            selectedColorIndex = null;
        };

        const checkGameComplete = () => {
            const keys = Object.keys(pathData);
            if(keys.length === 0) return false;
            return keys.every(key => pathData[key].isFilled);
        };

        // --- פעולות ואירועים גלובליים לחלון ---
        window.setMode = (newMode) => { 
            mode = newMode; 
            if (mode === 'student') initGame();
            renderApp();

            currentTopic = val; 
            if (mode === 'student') initGame();
            renderApp(); 
        };
        
        window.setCurrentImageId = (val) => { 
            currentImageId = val; 
            if (mode === 'student') initGame();
            renderApp(); 
        };
        
        window.setCurrentPaletteId = (val) => { 
            currentPaletteId = val; 
            if (mode === 'student') initGame();
            renderApp(); 
        };
        
        window.updateCustomAnswer = (idx, val) => { 
            customData[idx].answer = val; 
            // ללא render מלא כדי לא לאבד פוקוס בהקלדה
        };
        
        window.updateCustomQuestion = (cIdx, qIdx, val) => { 
            customData[cIdx].questions[qIdx] = val; 
            // ללא render מלא כדי לא לאבד פוקוס בהקלדה
        };
        
        window.setSelectedColorIndex = (idx) => { 
            selectedColorIndex = idx; 
            renderApp(); 
        };

        window.initAndRenderGame = () => {
            initGame();
            renderApp();
        };

        window.handlePathClick = (pathId) => {
            if (selectedColorIndex === null) return;
            
            const pData = pathData[pathId];
            if (pData.isFilled) return;

            if (pData.colorIndex === selectedColorIndex) {
                pathData[pathId].isFilled = true;
                renderApp();
            } else {
                const el = document.getElementById(`path-${pathId}`);
                if(el) {
                    el.style.fill = '#cbd5e1'; 
                    setTimeout(() => {
                        // אם עדיין לא נצבע נכון, נחזיר ללבן
                        if(!pathData[pathId].isFilled) {

        const renderHeader = () => `

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                        ${activeColors.map((color, index) => `

                                        <input type="text" placeholder="תשובה (למשל: 10)"

                                    <div class="space-y-2">
                                        ${customData[index].questions.map((q, qIndex) => `

                                                class="w-full p-2 border-2 border-slate-100 rounded-lg text-base font-medium text-center outline-none focus:border-orange-300 focus:bg-orange-50"

            }

            return `
            <div class="p-6 bg-white rounded-3xl shadow-xl max-w-6xl mx-auto" dir="rtl">

                                    </button>
                                `).join('')}
                            </div>
                        </div>
                        <div>
                            <label class="block text-xl font-bold mb-3 text-slate-700">בחר איור התחלתי:</label>
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                                ${Object.values(IMAGES).map(img => `
                                    <button onclick="window.setCurrentImageId('${img.id}')" class="p-3 rounded-xl border-4 font-black text-sm flex flex-col items-center justify-center gap-2 transition ${currentImageId === img.id ? 'border-blue-400 bg-blue-50 text-blue-800 shadow-md scale-105' : 'border-slate-200 hover:border-slate-300 bg-white text-slate-600 hover:bg-slate-100'}">

                            </div>
                        </div>
                    </div>
                    <div>
                        ${customContentHTML}
                    </div>
                </div>

                <div class="mt-10 flex justify-center">
                    <button onclick="window.setMode('student')" class="flex items-center gap-3 bg-slate-800 hover:bg-slate-900 text-white px-10 py-5 rounded-full text-2xl font-black shadow-xl hover:shadow-2xl transition transform hover:scale-105">
                        ${Icons.Play(28, '', 'currentColor')}
                        לשחק ולצבוע!
                    </button>
                </div>
            </div>`;
        };

        const renderStudentPanel = () => {
            const activeImage = IMAGES[currentImageId];
            const activeColors = getActiveColors();
            const isComplete = checkGameComplete();

            const imageSelectorHTML = Object.values(IMAGES).map(img => `
                <button onclick="window.setCurrentImageId('${img.id}')" class="flex-shrink-0 px-4 py-2 rounded-xl font-black text-base transition-all whitespace-nowrap ${currentImageId === img.id ? 'bg-slate-700 text-white shadow-md transform scale-105' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-800'}">
                    ${img.name}
                </button>
            `).join('');

            const legendHTML = gameLegend.map(item => `
                <button onclick="window.setSelectedColorIndex(${item.colorIndex})" class="relative h-20 rounded-2xl flex flex-col items-center justify-center font-black text-2xl transition-all duration-300 transform border-4 ${selectedColorIndex === item.colorIndex ? 'scale-105 shadow-xl z-10 border-white' : 'hover:scale-105 shadow-sm hover:shadow-md hover:-translate-y-1 border-transparent'}" style="background-color: ${item.hex}; color: #0f172a; box-shadow: ${selectedColorIndex === item.colorIndex ? `0 0 0 4px #0f172a, 0 10px 25px -5px ${item.hex}` : ''}">
                    <span style="font-family: Arial, Tahoma, 'Segoe UI', sans-serif;">${item.answer}</span>
                    ${selectedColorIndex === item.colorIndex ? `<div class="absolute -top-4 -right-4 bg-white text-slate-800 rounded-full p-2 shadow-lg border-2 border-slate-200 animate-bounce">${Icons.PaintBucket(22, '', 'currentColor')}</div>` : ''}
                </button>
            `).join('');

            // SVG Construction
            const interactivePaths = activeImage.paths.map(path => {
                const pd = pathData[path.id];
                if (!pd) return '';
                const isFilled = pd.isFilled;
                const fillHex = isFilled ? activeColors[pd.colorIndex].hex : '#ffffff';
                const hoverClass = (!isFilled && selectedColorIndex !== null) ? 'hover:fill-slate-50' : '';
                return `
                    <path id="path-${path.id}" onclick="window.handlePathClick('${path.id}')" d="${path.d}" fill="${fillHex}" stroke="#334155" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" style="transition: fill 0.3s ease-in-out" class="cursor-pointer ${hoverClass}"></path>
                `;
            }).join('');

            const staticDecorations = (activeImage.decorations || []).map(deco => `
                <path d="${deco.d}" fill="${deco.fill || 'none'}" stroke="${deco.stroke || 'none'}" stroke-width="${deco.strokeWidth || '0'}" stroke-linecap="${deco.strokeLinecap || 'butt'}" stroke-linejoin="round" opacity="${deco.opacity || 1}" class="pointer-events-none select-none"></path>

            const pointers = activeImage.paths.map(path => {
                const pd = pathData[path.id];
                if (!pd || pd.isFilled) return '';
                if (path.pointerLine) {

                }
                return '';
            }).join('');

            const texts = activeImage.paths.map(path => {
                const pd = pathData[path.id];
                if (!pd || pd.isFilled) return '';
                const calculatedFontSize = getDynamicFontSize(pd.question, path.fontSize || 16);
                const finalX = path.textX !== undefined ? path.textX : path.cx;
                const finalY = path.textY !== undefined ? path.textY : path.cy;
                return `
                    <text x="${finalX}" y="${finalY}" text-anchor="middle" dominant-baseline="central" style="font-size: ${calculatedFontSize}px; font-family: Arial, Tahoma, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 900; fill: #0f172a; pointer-events: none; user-select: none; unicode-bidi: isolate;">${pd.question}</text>

            }).join('');

                        ${Icons.Check(80, "text-yellow-600")}
                    </div>
                    <h2 class="text-6xl font-black text-slate-800 mb-4 text-center drop-shadow-sm">אלופה / אלוף!</h2>
                    <p class="text-3xl text-slate-600 mb-10 font-black">סיימת לצבוע הכל נכון.</p>
                    <button onclick="window.initAndRenderGame()" class="bg-slate-800 hover:bg-slate-900 text-white px-10 py-4 rounded-full text-2xl font-black shadow-xl transition transform hover:scale-110 flex gap-3 items-center">
                        ${Icons.PaintBucket(28, '', 'currentColor')}
                        לצבוע מחדש
                    </button>
                </div>`;
            }

            return `
            <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-8 items-start" dir="rtl">
                <div class="w-full lg:w-1/3 flex flex-col gap-6">
                    <div class="bg-white p-3 rounded-2xl shadow-sm border-2 border-slate-200 flex overflow-x-auto gap-3 scrollbar-hide">
                        ${imageSelectorHTML}
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-lg border-t-8 border-t-blue-300 flex flex-col items-center">
                        <div class="flex items-center gap-3 mb-6 text-3xl font-black text-slate-800">
                            ${Icons.Palette(32, "text-blue-400")}
                            <h2>בחר צבע ותשובה</h2>
                        </div>
                        <div class="grid grid-cols-2 gap-4 w-full">
                            ${legendHTML}
                        </div>
                        <button onclick="window.initAndRenderGame()" class="mt-8 flex items-center gap-2 text-slate-400 hover:text-slate-700 font-bold text-lg transition bg-slate-50 px-6 py-2 rounded-full border-2 border-slate-200 hover:border-slate-300">
                            ${Icons.Undo(20)} נקה ציור והתחל מחדש
                        </button>
                    </div>
                </div>

                <div class="w-full lg:w-2/3 bg-white p-4 md:p-8 rounded-[2.5rem] shadow-xl border-4 border-slate-200 relative overflow-hidden flex items-center justify-center min-h-[60vh]">
                    ${completeOverlayHTML}
                    <div class="w-full max-w-3xl mx-auto aspect-square relative">
                        <svg viewBox="${activeImage.viewBox}" direction="ltr" class="w-full h-full drop-shadow-sm bg-slate-50/30 rounded-3xl border-2 border-dashed border-slate-200 relative">
                            <defs>
                                <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"></path>
                                </marker>
                            </defs>
                            ${interactivePaths}
                            ${staticDecorations}
                            ${pointers}
                            ${texts}
                        </svg>
                    </div>
                </div>
            </div>`;
        };

        const renderApp = () => {
            const root = document.getElementById('root');
            root.innerHTML = `
                ${renderHeader()}
                <main class="px-4 pb-16 flex-grow">
                    ${mode === 'teacher' ? renderTeacherPanel() : renderStudentPanel()}
                </main>
                <footer class="text-center py-8 text-slate-500 font-bold border-t-2 border-slate-200 bg-slate-50 mt-auto">
                    <p>יצרה בעזרת AI : מורן קמיל גלברג</p>
                </footer>
            `;
        };

        // --- הפעלה ראשונית ---
        initGame();
        renderApp();
    </script>
</body>
</html>
